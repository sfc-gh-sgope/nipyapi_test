# avro-kafka-high-performance-connector.config.yaml
# Parameters applied after deploying the flow to the runtime.
# Only include parameters you want to set or override from the flow defaults.

parameters:
  # --- Kafka Source ---
  Kafka Bootstrap Servers: "dlp-dev-gcp-kafka-kafka-0-client.dlp-common-c331a38.svc.prod1-us-east1.gke.kaas-prod-us.gcp.extscloud.com:16743,dlp-dev-gcp-kafka-kafka-1-client.dlp-common-c331a38.svc.prod1-us-east1.gke.kaas-prod-us.gcp.extscloud.com:16743,dlp-dev-gcp-kafka-kafka-2-client.dlp-common-c331a38.svc.prod1-us-east1.gke.kaas-prod-us.gcp.extscloud.com:16743,dlp-dev-gcp-kafka-kafka-3-client.dlp-common-c331a38.svc.prod1-us-east1.gke.kaas-prod-us.gcp.extscloud.com:16743,dlp-dev-gcp-kafka-kafka-4-client.dlp-common-c331a38.svc.prod1-us-east1.gke.kaas-prod-us.gcp.extscloud.com:16743"
  Kafka Topics: "dlp-common-c331a38_dlp-dev-gcp-kafka.part"
  Kafka Topic Format: "names"
  Kafka Consumer Group ID: "hcpdlp-gcp-kafka-consumer-openflow-medium-100m-evol"
  Kafka Auto Offset Reset: "earliest"
  Schema Registry URL: "https://cfk.nonprod.schema-registry-prod-us.gcp.extscloud.com/"

  # --- Avro Transform ---
  AvroRecord Transform Spec: |
    [
      {
        "operation": "shift",
        "spec": {
          "kafkaMetadata": "kafkaMetadata",
          "headers": {
            "operation": "CDC_FLAG",
            "changeSequence": "header__change__seq"
          },
          "data": {
            "*": "&"
          }
        }
      }
    ]

  # --- Snowflake Destination ---
  Snowflake Destination Database: "XYT_DEV_OPENFLOW_DB"
  Snowflake Destination Schema: "POC_SCHEMA"
  Snowflake Destination Table: "PART_ICEBERG_AVRO_EVOL"

# Assets — downloaded from Snowflake internal stage
assets:
  - name: "kafka.client.keystore.jks"
    stage: "OPENFLOW.OPENFLOW.NIFI_ASSETS"
    parameter: "Keystore File"
  - name: "kafka.client.truststore.jks"
    stage: "OPENFLOW.OPENFLOW.NIFI_ASSETS"
    parameter: "Truststore File"
